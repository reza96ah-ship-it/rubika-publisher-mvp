name: Apply Dashboard acceptance fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/dashboard-v2-acceptance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-v2-acceptance
          fetch-depth: 0

      - name: Apply deterministic acceptance fixes
        run: python tools/apply_dashboard_acceptance_fix.py

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend/lib/dashboard.test.ts .github/scripts
          if git diff --cached --quiet; then
            echo "Acceptance changes are already applied."
            exit 0
          fi
          git commit -m "test(dashboard): support Node loader tests"
          git push origin HEAD:fix/dashboard-v2-acceptance
