name: Apply Composer foundation migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/composer-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Composer branch
        uses: actions/checkout@v4
        with:
          ref: feat/composer-v2
          fetch-depth: 0

      - name: Apply deterministic route migration
        run: python tools/migrate_composer_foundation.py

      - name: Commit migrated route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/compose/_page.tsx
          if git diff --cached --quiet; then
            echo "Composer route is already migrated."
            exit 0
          fi
          git commit -m "refactor(composer): use domain and repository modules"
          git push origin HEAD:feat/composer-v2
