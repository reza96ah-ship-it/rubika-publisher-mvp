name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --format json --output-file lint-report.json

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend/lint-report.json
          if-no-files-found: ignore

      - name: Token audit
        run: npm run token:audit

      - name: Typecheck
        run: bash -o pipefail -c 'npm run typecheck 2>&1 | tee typecheck-report.txt'

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-report
          path: frontend/typecheck-report.txt
          if-no-files-found: ignore

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rubika_publisher
          POSTGRES_USER: rubika_user
          POSTGRES_PASSWORD: change_this_db_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubika_user -d rubika_publisher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://rubika_user:change_this_db_password@localhost:5432/rubika_publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall app

      - name: Check migrations
        run: |
          alembic heads
          alembic upgrade head
          alembic current

      - name: Import app
        run: python -c "from app.main import app; print(app.title)"

      - name: Test
        run: pytest

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare validation environment
        run: cp .env.production.example .env.production

      - name: Validate shell scripts
        run: bash -n scripts/production-common.sh scripts/deploy-production.sh scripts/rollback-production.sh scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/smoke-check-production.sh

      - name: Validate production Compose
        run: bash -o pipefail -c 'docker compose --env-file .env.production -f compose.production.yaml config 2>&1 | tee compose-config.log'

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-compose-config
          path: compose-config.log
          if-no-files-found: warn

      - name: Build production images
        run: docker compose --env-file .env.production -f compose.production.yaml build backend frontend

  format-generated-pages:
    name: Format generated pages
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/remove-legacy-page-shell-wrappers'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-page-shell-wrappers
          fetch-depth: 0

      - name: Normalize outer JSX indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              "frontend/app/_workspace-page.tsx",
              "frontend/app/analytics/_page.tsx",
              "frontend/app/calendar/_page.tsx",
              "frontend/app/campaigns/_page.tsx",
              "frontend/app/channels/_page.tsx",
              "frontend/app/compose/_page.tsx",
              "frontend/app/content/_page.tsx",
              "frontend/app/design-system/_page.tsx",
              "frontend/app/inbox/_page.tsx",
              "frontend/app/instagram/_page.tsx",
              "frontend/app/logs/_page.tsx",
              "frontend/app/media/_page.tsx",
              "frontend/app/onboarding/_page.tsx",
              "frontend/app/queue/_page.tsx",
              "frontend/app/rubika/_page.tsx",
              "frontend/app/store/_page.tsx",
          ]

          marker = "\n  return (\n<"
          closing = "\n);\n}"
          for value in paths:
              path = Path(value)
              text = path.read_text(encoding="utf-8")
              start = text.rfind(marker)
              end = text.rfind(closing)
              if start < 0 or end < start:
                  raise SystemExit(f"Unexpected generated indentation in {value}")
              body_start = start + len("\n  return (\n")
              lines = text[body_start:end].splitlines()
              lines[0] = "    " + lines[0]
              for index in range(1, len(lines)):
                  if lines[index].startswith("    "):
                      lines[index] = lines[index][4:]
              text = text[:body_start] + "\n".join(lines) + "\n  );\n}" + text[end + len(closing):]
              path.write_text(text, encoding="utf-8")

          Path("tools/test.txt").unlink(missing_ok=True)
          PY

      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/ci.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting cleanup remains."
            exit 0
          fi
          git commit -m "style(frontend): normalize workspace page indentation"
          git push origin HEAD:refactor/remove-legacy-page-shell-wrappers
