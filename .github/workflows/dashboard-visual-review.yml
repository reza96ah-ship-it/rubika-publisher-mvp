name: Dashboard visual review

on:
  push:
    branches:
      - feat/dashboard-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start real application stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3100/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 backend frontend
          exit 1

      - name: Seed representative operational data
        run: |
          docker compose exec -T backend python - <<'PY'
          from datetime import datetime, timedelta
          from app.database import SessionLocal
          from app.models import Campaign, ChannelAccount, InstagramAccount, Post, PublishAttempt, RubikaAccount, Store

          now = datetime.utcnow()
          with SessionLocal() as db:
              for model in (PublishAttempt, Post, Campaign, ChannelAccount, InstagramAccount, RubikaAccount, Store):
                  db.query(model).delete()
              db.commit()

              store = Store(
                  name="فروشگاه نمونه نشرینو",
                  category="پوشاک و سبک زندگی",
                  description="فضای کاری نمونه برای بازبینی داشبورد عملیاتی",
                  brand_primary_color="#0F766E",
                  brand_accent_color="#2563EB",
                  timezone="Asia/Tehran",
              )
              db.add(store)
              db.flush()

              db.add(RubikaAccount(
                  bot_token="visual-review-token",
                  chat_id="visual-review-channel",
                  bot_name="Nashrino Demo",
                  status="connected",
                  last_test_at=now,
                  is_active=True,
              ))
              db.add(InstagramAccount(
                  store_id=store.id,
                  username="nashrino_demo",
                  account_type="personal",
                  publish_mode="reminder",
                  status="reminder_ready",
                  last_test_at=now,
                  is_active=True,
              ))

              launch = Campaign(
                  store_id=store.id,
                  name="کمپین رونمایی تابستان",
                  goal="افزایش آگاهی و آماده‌سازی تقویم انتشار",
                  status="active",
                  color="#0F766E",
                  owner="تیم محتوا",
                  starts_at=now - timedelta(days=4),
                  ends_at=now + timedelta(days=12),
              )
              retention = Campaign(
                  store_id=store.id,
                  name="بازگشت مشتریان وفادار",
                  goal="افزایش تعامل و خرید مجدد",
                  status="active",
                  color="#2563EB",
                  owner="عملیات شبکه اجتماعی",
                  starts_at=now - timedelta(days=2),
                  ends_at=now + timedelta(days=20),
              )
              db.add_all([launch, retention])
              db.flush()

              scheduled = Post(
                  store_id=store.id,
                  title="معرفی مجموعه تابستانی",
                  caption="انتشار بعدی کمپین رونمایی",
                  platform="rubika,instagram",
                  status="scheduled",
                  timezone="Asia/Tehran",
                  campaign_id=launch.id,
                  campaign=launch.name,
                  scheduled_at=now + timedelta(hours=2),
                  ready_at=now - timedelta(hours=3),
                  approval_status="approved",
                  reviewed_at=now - timedelta(hours=4),
                  reviewed_by="مدیر محتوا",
              )
              failed = Post(
                  store_id=store.id,
                  title="پیشنهاد ویژه آخر هفته",
                  caption="نیازمند بازیابی انتشار",
                  platform="rubika",
                  status="failed",
                  timezone="Asia/Tehran",
                  campaign_id=launch.id,
                  campaign=launch.name,
                  failed_at=now - timedelta(hours=1),
                  approval_status="approved",
                  last_error="پاسخ کانال در مهلت تعیین‌شده دریافت نشد",
                  attempt_count=2,
              )
              approval = Post(
                  store_id=store.id,
                  title="داستان مشتری وفادار",
                  caption="در انتظار بازبینی نهایی",
                  platform="instagram",
                  status="ready",
                  timezone="Asia/Tehran",
                  campaign_id=retention.id,
                  campaign=retention.name,
                  ready_at=now - timedelta(hours=5),
                  approval_status="pending",
                  submitted_at=now - timedelta(hours=5),
              )
              published_recent = Post(
                  store_id=store.id,
                  title="راهنمای انتخاب محصول",
                  platform="rubika",
                  status="published",
                  timezone="Asia/Tehran",
                  campaign_id=retention.id,
                  campaign=retention.name,
                  published_at=now - timedelta(days=1),
                  approval_status="not_required",
              )
              published_recent_2 = Post(
                  store_id=store.id,
                  title="پشت صحنه آماده‌سازی سفارش‌ها",
                  platform="instagram",
                  status="published",
                  timezone="Asia/Tehran",
                  campaign_id=launch.id,
                  campaign=launch.name,
                  published_at=now - timedelta(days=4),
                  approval_status="approved",
              )
              published_previous = Post(
                  store_id=store.id,
                  title="پست هفته گذشته",
                  platform="rubika",
                  status="published",
                  timezone="Asia/Tehran",
                  published_at=now - timedelta(days=10),
                  approval_status="not_required",
              )
              db.add_all([scheduled, failed, approval, published_recent, published_recent_2, published_previous])
              db.flush()

              db.add_all([
                  PublishAttempt(
                      post_id=published_recent.id,
                      channel="rubika",
                      action="scheduled",
                      status="success",
                      request_payload="{}",
                      response_payload='{"message_id":"demo-1"}',
                      started_at=now - timedelta(days=1, minutes=2),
                      finished_at=now - timedelta(days=1),
                      created_at=now - timedelta(days=1, minutes=2),
                  ),
                  PublishAttempt(
                      post_id=published_recent_2.id,
                      channel="instagram",
                      action="manual",
                      status="success",
                      request_payload="{}",
                      response_payload="{}",
                      started_at=now - timedelta(days=4, minutes=1),
                      finished_at=now - timedelta(days=4),
                      created_at=now - timedelta(days=4, minutes=1),
                  ),
                  PublishAttempt(
                      post_id=failed.id,
                      channel="rubika",
                      action="retry",
                      status="failed",
                      request_payload="{}",
                      response_payload="{}",
                      error="پاسخ کانال در مهلت تعیین‌شده دریافت نشد",
                      started_at=now - timedelta(hours=1, minutes=3),
                      finished_at=now - timedelta(hours=1),
                      created_at=now - timedelta(hours=1, minutes=3),
                  ),
                  PublishAttempt(
                      post_id=scheduled.id,
                      channel="rubika",
                      action="scheduled",
                      status="started",
                      request_payload="{}",
                      response_payload="{}",
                      started_at=now - timedelta(minutes=2),
                      created_at=now - timedelta(minutes=2),
                  ),
              ])
              db.commit()
          PY

      - name: Install browser runtime
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture responsive light and dark dashboards
        working-directory: frontend
        run: |
          mkdir -p visual-review
          cat > /tmp/capture-dashboard.cjs <<'NODE'
          const { chromium } = require(process.cwd() + "/node_modules/playwright");
          const fs = require("fs");

          (async () => {
            const login = await fetch("http://127.0.0.1:8000/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: "admin@example.com", password: "change_this_password" })
            });
            if (!login.ok) throw new Error(`Login failed: ${login.status}`);
            const { access_token: token } = await login.json();
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: "mobile-light", width: 390, height: 844, theme: "light" },
              { name: "mobile-dark", width: 390, height: 844, theme: "dark" },
              { name: "desktop-light", width: 1440, height: 900, theme: "light" },
              { name: "desktop-dark", width: 1440, height: 900, theme: "dark" }
            ];

            for (const item of cases) {
              const context = await browser.newContext({
                viewport: { width: item.width, height: item.height },
                colorScheme: item.theme
              });
              const page = await context.newPage();
              const browserErrors = [];
              page.on("pageerror", (error) => browserErrors.push(error.message));
              await page.addInitScript(({ token, theme }) => {
                localStorage.setItem("rubika_publisher_access", token);
                localStorage.setItem("theme", theme);
                document.documentElement.setAttribute("data-theme", theme);
              }, { token, theme: item.theme });
              await page.goto("http://127.0.0.1:3100/", { waitUntil: "networkidle" });
              await page.getByRole("heading", { name: "داشبورد", exact: true }).waitFor();
              await page.waitForTimeout(750);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (overflow) throw new Error(`${item.name}: horizontal overflow detected`);
              if (browserErrors.length) throw new Error(`${item.name}: ${browserErrors.join(" | ")}`);
              await page.screenshot({ path: `visual-review/${item.name}.png`, fullPage: true });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync("visual-review/result.txt", "Dashboard visual capture passed at 390x844 and 1440x900 in light and dark modes.\n");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/capture-dashboard.cjs

      - name: Upload dashboard review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-v2-visual-review
          path: frontend/visual-review
          if-no-files-found: error
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=250 backend frontend
