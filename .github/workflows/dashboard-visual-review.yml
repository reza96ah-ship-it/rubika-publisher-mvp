name: Dashboard visual review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start real application stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3100/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 backend frontend
          exit 1

      - name: Seed representative operational data
        run: docker compose exec -T backend python - < .github/scripts/seed-dashboard-review.py

      - name: Install browser runtime
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture responsive light and dark dashboards
        working-directory: frontend
        run: |
          set -a
          source ../.env
          set +a
          mkdir -p visual-review
          VISUAL_ADMIN_EMAIL="$ADMIN_EMAIL" VISUAL_ADMIN_PASSWORD="$ADMIN_PASSWORD" node ../.github/scripts/capture-dashboard-review.cjs

      - name: Upload dashboard review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-v2-visual-review
          path: frontend/visual-review
          if-no-files-found: error
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=250 backend frontend
