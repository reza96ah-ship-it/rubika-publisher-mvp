name: Apply Dashboard milestone docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/dashboard-v2-acceptance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-v2-acceptance
          fetch-depth: 0

      - name: Update continuity documents
        run: python tools/update_dashboard_milestone_docs.py

      - name: Commit milestone transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md docs/IMPLEMENTATION_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Milestone documents are already current."
            exit 0
          fi
          git commit -m "docs: complete Dashboard V2 milestone"
          git push origin HEAD:fix/dashboard-v2-acceptance
